[build]
dockerfilePath = "redis/Dockerfile"
rootDirectory = "."
watchPaths = ["redis/"]

[deploy]
# Redis service is stateful, restart on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Health check for Redis
healthcheckPath = ""  # Redis uses TCP check via Dockerfile
healthcheckTimeout = 300

# Memory for Redis (512MB - adjust based on data volume)
# Note: Uncomment if Railway supports resource specification
# memoryMB = 512

# Redis is internal-only service, accessed by knowledgebase_ingestion and website_crawling
# No port exposed to external traffic
