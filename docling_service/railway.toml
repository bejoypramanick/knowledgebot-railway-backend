[build]
dockerfilePath = "docling_service/Dockerfile"
rootDirectory = ".."

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300

# IMPORTANT: Docling requires significant memory for ML models
# Minimum 4GB recommended, 6GB+ for stability with large PDFs
# If service keeps restarting, increase memory in Railway dashboard
# Memory usage: ~2GB for models + 1-2GB per file being processed
