[build]
dockerfilePath = "docling_service/Dockerfile"
rootDirectory = ".."
# Only rebuild when docling_service or shared changes
# Ignores changes in other services (knowledgebase_ingestion, website_crawling, etc.)

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300
# Memory and CPU for Docling (requires more resources for ML models)
# Note: These are Railway recommendations - adjust based on your plan
# Uncomment and adjust if Railway supports resource specification
# memoryMB = 4096
# cpuCount = 2
