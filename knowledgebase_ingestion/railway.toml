[build]
dockerfilePath = "knowledgebase_ingestion/Dockerfile"
rootDirectory = ".."
watchPaths = ["knowledgebase_ingestion/", "shared/"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300
# No startCommand - Railway uses CMD from Dockerfile

