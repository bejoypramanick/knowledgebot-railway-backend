[build]
dockerfilePath = "celery-web-worker/Dockerfile"
rootDirectory = "."

[deploy]
# Celery worker for web crawling queue
# Note: WORKDIR in Dockerfile is /app/celery-web-worker, so no need for cd
# Using gevent pool for better I/O concurrency without thread exhaustion
# Concurrency is controlled by CELERY_WEB_CONCURRENCY env var (default: 10)
# Parallel processing: 10 concurrent website crawls can be processed simultaneously
startCommand = "celery -A celery_app worker -Q web_crawling -l info --pool=gevent --concurrency=10 --max-tasks-per-child=50"

# Restart policy for worker reliability
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables needed (set in Railway dashboard):
# - REDIS_URL=redis://redis.railway.internal:6379/1  (or WEB_REDIS_URL)
# - DATABASE_URL=postgresql://...
# - GEMINI_API_KEY=...
#
# This worker processes:
# - Website scraping (scrape_website_task)
# - Website status: Queued → processing → completed/failed
# - Celery queue: web_crawling (Redis DB 1)
