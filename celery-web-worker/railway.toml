[build]
dockerfilePath = "celery-web-worker/Dockerfile"
rootDirectory = "."

[deploy]
# Celery worker for web crawling queue
# Note: WORKDIR in Dockerfile is /app/celery-web-worker, so no need for cd
# Using prefork pool for better asyncio compatibility
# Parallel processing: 5 concurrent website crawls can be processed simultaneously
# Concurrency: 5 workers (prefork processes)
startCommand = "celery -A celery_app worker -Q web_crawling -l info --pool=prefork --concurrency=5 --max-tasks-per-child=50"

# Restart policy for worker reliability
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables needed (set in Railway dashboard):
# - REDIS_URL=redis://redis.railway.internal:6379
# - WEB_TASK_QUEUE_REDIS_DB=1
# - DATABASE_URL=postgresql://...
# - GEMINI_API_KEY=...
# - KREUZBERG_API_URL=http://kreuzberg.railway.internal:8000
# - GEMINI_FILE_SEARCH_STORE_NAME=knowledgebotsearchstore-xxxxx
#
# This worker processes:
# - Website scraping (scrape_website_task)
# - Website status: Queued → processing → completed/failed
# - Celery queue: web_crawling (Redis DB 1)
