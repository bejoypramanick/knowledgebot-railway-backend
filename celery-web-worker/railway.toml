[build]
dockerfilePath = "celery-web-worker/Dockerfile"
rootDirectory = "."

[deploy]
# Celery worker for web crawling queue
startCommand = "cd /app/celery-web-worker && celery -A celery_app worker -Q web_crawling -l info -c 1 --max-tasks-per-child=100"

# Restart policy for worker reliability
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables needed (set in Railway dashboard):
# - REDIS_URL=redis://redis.railway.internal:6379/1  (or WEB_REDIS_URL)
# - DATABASE_URL=postgresql://...
# - GEMINI_API_KEY=...
#
# This worker processes:
# - Website scraping (scrape_website_task)
# - Website status: Queued → processing → completed/failed
# - Celery queue: web_crawling (Redis DB 1)
