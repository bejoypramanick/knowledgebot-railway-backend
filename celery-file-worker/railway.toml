[build]
dockerfilePath = "celery-file-worker/Dockerfile"
rootDirectory = "."

[deploy]
# Celery worker for file processing queue
# Note: WORKDIR in Dockerfile is /app/celery-file-worker, so no need for cd
# Using gevent pool for better I/O concurrency without thread exhaustion
# Parallel processing: 10 concurrent file uploads can be processed simultaneously
# Concurrency: 10 workers (hardcoded, modify here to change)
startCommand = "celery -A celery_app worker -Q file_processing -l info --pool=gevent --concurrency=10 --max-tasks-per-child=50"

# Restart policy for worker reliability
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables needed (set in Railway dashboard):
# - REDIS_URL=redis://redis.railway.internal:6379/0  (or FILE_REDIS_URL)
# - DATABASE_URL=postgresql://...
# - GEMINI_API_KEY=...
#
# This worker processes:
# - File uploads (process_file_upload_task)
# - File status: Queued → processing → completed/failed
# - Celery queue: file_processing (Redis DB 0)
