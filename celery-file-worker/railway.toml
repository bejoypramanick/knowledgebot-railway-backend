[build]
dockerfilePath = "celery-file-worker/Dockerfile"
rootDirectory = "."

[deploy]
# Celery worker for file processing queue
startCommand = "celery -A knowledgebase_ingestion.celery_app worker -Q file_processing -l info -c 2 --max-tasks-per-child=1000"

# Make this a serverless function (pay per invocation)
function = true

# Restart policy for worker reliability
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check (Celery worker doesn't have HTTP endpoint, so we'll use a timeout-based check)
healthcheckTimeout = 300

# Worker configuration notes:
# -Q file_processing: Listen to file_processing queue (Redis DB 0)
# -l info: Log level INFO (shows task execution)
# -c 2: 2 concurrent worker processes (tuned for file processing workload)
# --max-tasks-per-child=1000: Restart worker process after 1000 tasks (prevents memory leaks)
#
# Environment variables needed (set in Railway dashboard):
# - REDIS_URL=redis://redis.railway.internal:6379/0
# - RAILWAY_POSTGRES_URL=postgresql://...
# - GEMINI_API_KEY=...
#
# This worker processes:
# - File uploads (process_file_upload_task)
# - File status: pending → processing → completed/failed
# - Timeout: 30 minutes (task_time_limit in knowledgebase_ingestion/celery_app.py)
