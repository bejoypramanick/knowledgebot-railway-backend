version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: knowledgebot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - REDIS_APPENDONLY=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  celery-file-worker:
    build:
      context: .
      dockerfile: celery/Dockerfile
    container_name: knowledgebot-celery-file-worker
    command: celery -A knowledgebase_ingestion.celery_app worker -Q file_processing -l info -c 2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledgebot
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - knowledgebot-network

  celery-web-worker:
    build:
      context: .
      dockerfile: celery/Dockerfile
    container_name: knowledgebot-celery-web-worker
    command: celery -A website_crawling.celery_app worker -Q web_crawling -l info -c 1
    environment:
      - REDIS_URL=redis://redis:6379/1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledgebot
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - knowledgebot-network

  celery-flower:
    image: mher/flower:2.0
    container_name: knowledgebot-celery-flower
    command: celery --broker=redis://redis:6379/0,redis://redis:6379/1 flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - knowledgebot-network

volumes:
  redis-data:

networks:
  knowledgebot-network:
    driver: bridge
